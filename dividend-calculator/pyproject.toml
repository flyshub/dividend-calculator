[project]
name = "dividend-calculator"
version = "0.2.0"
description = "A股真实股息率计算工具 — mootdx + 腾讯双引擎，全球可用"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
dependencies = [
    "mootdx>=0.11.0",
    "pandas>=2.0.0",
    "click>=8.0.0",
    "requests>=2.22.0",
    "akshare>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
dividend = "src.main:dividend"
dividend-web = "src.web:main"
