[project]
name = "dividend-calculator"
version = "0.2.0"
description = "A股真实股息率计算工具 — mootdx + 腾讯双引擎，全球可用"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
dependencies = [
    "mootdx>=0.11.0,<1.0",
    "pandas>=2.0.0",
    "click>=8.0.0",
    "requests>=2.22.0",
    "akshare>=1.12.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6",
]

[tool.ruff]
# 只上「真错误」类规则（pyflakes + 语法错误），不上格式/风格类：
# 全量规则当前有 1200+ 项历史噪音，会淹没真问题。
# 对外再导出的名字用 `# noqa: F401` 显式标注（见 pr.py / screener_finance.py）。
[tool.ruff.lint]
select = ["F", "E9"]

[project.scripts]
dividend = "src.main:dividend"
dividend-web = "src.web:main"
