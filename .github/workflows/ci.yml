name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r dividend-calculator/requirements.txt pytest

      - name: Run pytest (unit only, no network)
        working-directory: dividend-calculator
        run: python -m pytest tests/ -q -m "not integration"

  js-tests:
    name: JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run node tests
        working-directory: dividend-calculator
        run: node --test site/js/*.test.js

  verify-dual-end:
    name: JS/Python 双端一致性验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          pip install -r dividend-calculator/requirements.txt

      - name: Run dual-end verification (live data)
        working-directory: dividend-calculator
        run: python scripts/verify_js_vs_python.py
