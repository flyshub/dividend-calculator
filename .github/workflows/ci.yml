name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-lint:
    name: Python lint (ruff F,E9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 只跑 pyflakes + 语法错误：拦死导入、未定义名、未使用变量/遮蔽。
      # 规则集与配置见 dividend-calculator/pyproject.toml 的 [tool.ruff]。
      - name: Install ruff
        run: pip install "ruff>=0.6"

      - name: Run ruff
        working-directory: dividend-calculator
        run: ruff check src scripts tests

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r dividend-calculator/requirements.txt pytest

      - name: Run pytest (unit only, no network)
        working-directory: dividend-calculator
        run: python -m pytest tests/ -q -m "not integration"

  js-tests:
    name: JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run node tests
        working-directory: dividend-calculator
        run: node --test site/js/*.test.js

  verify-dual-end:
    name: JS/Python 双端一致性验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install deps
        run: |
          pip install -r dividend-calculator/requirements.txt

      - name: Run dual-end verification (live data)
        working-directory: dividend-calculator
        run: python scripts/verify_js_vs_python.py
