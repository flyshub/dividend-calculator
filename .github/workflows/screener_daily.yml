name: Screener Daily

on:
  schedule:
    # 北京 18:30（UTC+8，A股收盘后）每日跑；cron 用 UTC，10:30 UTC = 18:30 北京
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  # gh workflow run（创建 workflow_dispatch 事件）需要 actions: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r dividend-calculator/requirements.txt

      # 从 GitHub Release 拉取 seed 数据库（screener.db 139MB，超 git 100MB 限制，
      # 用 Release asset 存 seed。首次或 seed 更新时手动 gh release upload）
      - name: Download seed screener.db from Release
        run: |
          mkdir -p dividend-calculator/data
          gh release download screener-seed \
            --repo ${{ github.repository }} \
            --pattern "screener.db" \
            --dir dividend-calculator/data \
            --clobber \
            || echo "seed 不存在，跳过（首次需手动上传）"
        env:
          GH_TOKEN: ${{ github.token }}

      # 每日跑选股器：刷新行情（腾讯批量，全球可用）+ 出 CSV
      - name: Run screener (refresh quotes)
        id: run_screener
        working-directory: dividend-calculator
        continue-on-error: true
        run: |
          if [ -f data/screener.db ]; then
            python -m src.screener --refresh quotes
          else
            echo "缺少 seed screener.db，无法运行"
            exit 1
          fi

      # 提交 CSV 结果回仓库（data/screener/ 正常跟踪，无需 force-add）
      - name: Commit screener CSV
        if: steps.run_screener.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dividend-calculator/data/screener/
          if git diff --cached --quiet; then
            echo "No CSV changes"
          else
            git commit -m "chore(screener): daily update [skip ci]"
            git push
          fi

      # 导出 JSON 供 Pages 展示（读 data/screener/*.csv → site/screener/ + src/static/screener/，纯标准库）
      - name: Export screener JSON
        if: steps.run_screener.outcome == 'success'
        id: export_json
        working-directory: dividend-calculator
        continue-on-error: true
        run: python scripts/export_screener_json.py

      # 提交 JSON（site/ 与 src/static/ 均不被 gitignore，正常 add）
      - name: Commit & push screener JSON
        id: commit_json
        if: steps.export_json.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dividend-calculator/site/screener/ dividend-calculator/src/static/screener/
          if git diff --cached --quiet; then
            echo "No screener JSON changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(screener): update pages json [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # 输出本次 push 的 SHA，供 Trigger 步轮询远端 ref 落地
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # 显式触发 Pages 部署（仅当 JSON 有变更；轮询远端 SHA 落地后再 dispatch，避免部署旧数据）
      - name: Trigger Pages deploy
        if: steps.export_json.outcome == 'success' && steps.commit_json.outputs.changed == 'true'
        run: |
          target="${{ steps.commit_json.outputs.sha }}"
          for i in $(seq 1 30); do
            remote=$(git ls-remote origin -h refs/heads/main | cut -f1)
            if [ "$remote" = "$target" ]; then
              echo "remote main == $target"
              break
            fi
            echo "waiting for push to land ($i/30)..."
            sleep 5
          done
          gh workflow run pages.yml --repo ${{ github.repository }} \
            || echo "pages 触发失败，请手动 gh workflow run pages.yml"
        env:
          GH_TOKEN: ${{ github.token }}

      # 回传更新后的 screener.db 到 Release（每日行情累积，下次从最新 DB 开始）
      - name: Upload updated screener.db to Release
        if: steps.run_screener.outcome == 'success'
        run: |
          gh release upload screener-seed \
            --repo ${{ github.repository }} \
            dividend-calculator/data/screener.db \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # 失败建 Issue 通知（含 export 失败——continue-on-error 步失败不会让 job 红，需显式监听）
      - name: Create issue on failure
        if: steps.run_screener.outcome != 'success' || steps.export_json.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ 选股器每日更新失败',
              body: `## 选股器每日更新失败\n\n- **运行**: [查看日志](${context.serverUrl}/${context.repo.full_name}/actions/runs/${context.runId})\n- **时间**: ${new Date().toISOString()}\n\n请检查日志并手动触发 workflow_dispatch 重跑`,
              labels: ['bug', 'automation'],
            })
