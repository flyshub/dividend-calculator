name: Screener Daily

on:
  schedule:
    # 北京 18:30（UTC+8，A股收盘后）每日跑；cron 用 UTC，10:30 UTC = 18:30 北京
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  # gh workflow run（创建 workflow_dispatch 事件）需要 actions: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r dividend-calculator/requirements.txt

      # 从 GitHub Release 拉取 seed 数据库（screener.db 139MB，超 git 100MB 限制，
      # 用 Release asset 存 seed。首次或 seed 更新时手动 gh release upload）
      - name: Download seed screener.db from Release
        run: |
          mkdir -p dividend-calculator/data
          gh release download screener-seed \
            --repo ${{ github.repository }} \
            --pattern "screener.db" \
            --dir dividend-calculator/data \
            --clobber \
            || echo "seed 不存在，跳过（首次需手动上传）"
        env:
          GH_TOKEN: ${{ github.token }}

      # 每日跑选股器：刷新行情（腾讯批量，全球可用）+ 出 CSV
      - name: Run screener (refresh quotes)
        id: run_screener
        working-directory: dividend-calculator
        continue-on-error: true
        run: |
          if [ -f data/screener.db ]; then
            python -m src.screener --refresh quotes
          else
            echo "缺少 seed screener.db，无法运行"
            exit 1
          fi

      # 提交 CSV 结果回仓库（data/screener/ 正常跟踪，无需 force-add）
      - name: Commit screener CSV
        if: steps.run_screener.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dividend-calculator/data/screener/
          if git diff --cached --quiet; then
            echo "No CSV changes"
          else
            git commit -m "chore(screener): daily update [skip ci]"
            git push
          fi

      # 导出 JSON 供 Pages 展示（读 data/screener/*.csv → site/screener/ + src/static/screener/，纯标准库）
      - name: Export screener JSON
        if: steps.run_screener.outcome == 'success'
        id: export_json
        working-directory: dividend-calculator
        continue-on-error: true
        run: python scripts/export_screener_json.py

      # 提交 JSON（site/ 与 src/static/ 均不被 gitignore，正常 add）
      - name: Commit & push screener JSON
        id: commit_json
        if: steps.export_json.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dividend-calculator/site/screener/ dividend-calculator/src/static/screener/
          if git diff --cached --quiet; then
            echo "No screener JSON changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(screener): update pages json [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # 输出本次 push 的 SHA，供 Trigger 步轮询远端 ref 落地
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # 显式触发 Pages 部署（仅当 JSON 有变更；轮询远端 SHA 落地后再 dispatch，避免部署旧数据）
      - name: Trigger Pages deploy
        if: steps.export_json.outcome == 'success' && steps.commit_json.outputs.changed == 'true'
        run: |
          target="${{ steps.commit_json.outputs.sha }}"
          for i in $(seq 1 30); do
            remote=$(git ls-remote origin -h refs/heads/main | cut -f1)
            if [ "$remote" = "$target" ]; then
              echo "remote main == $target"
              break
            fi
            echo "waiting for push to land ($i/30)..."
            sleep 5
          done
          gh workflow run pages.yml --repo ${{ github.repository }} \
            || echo "pages 触发失败，请手动 gh workflow run pages.yml"
        env:
          GH_TOKEN: ${{ github.token }}

      # 回传更新后的 screener.db 到 Release，并保留最近 7 天历史版（防意外损坏无法回退）
      - name: Upload updated screener.db to Release
        if: steps.run_screener.outcome == 'success'
        run: |
          set -euo pipefail
          DB=dividend-calculator/data/screener.db
          # 1) 覆盖前先把 Release 当前版（上一日结果）存为历史备份。
          #    备份用「下载日期」命名（非旧 DB 数据日期）：无论运行空档多久，
          #    刚建的备份日期=今天，不会被下方 cutoff 立即剪掉（防"空档即剪"）。
          #    备份段整体独立容错：备份失败仅告警，绝不阻断主 DB 上传（HIGH#1）。
          if (
            set +e
            gh release view screener-seed --repo ${{ github.repository }} --json assets \
              --jq '.assets[].name' 2>/dev/null | grep -qx "screener.db" || { echo "警告: 无当前版可备份"; exit 0; }
            gh release download screener-seed --repo ${{ github.repository }} \
              --pattern "screener.db" --dir /tmp --clobber || { echo "警告: 备份下载失败，跳过备份"; exit 0; }
            BK_DATE=$(date -u +%Y%m%d)
            # 旧 DB 损坏（MAX(updated_at) 为 NULL）时用下载日期兜底，仍保留一份备份。
            # 注意：命令替换在 set -e 下会因 sqlite3 非零退出码中止，须 || true 兜底
            PREV_DATE=$(sqlite3 /tmp/screener.db \
              "SELECT REPLACE(MAX(updated_at), '-', '') FROM quote_snapshot" 2>/dev/null) || PREV_DATE=""
            [ -n "$PREV_DATE" ] && BK_DATE="$PREV_DATE"
            mv /tmp/screener.db "/tmp/screener_${BK_DATE}.db"
            gh release upload screener-seed --repo ${{ github.repository }} \
              "/tmp/screener_${BK_DATE}.db" --clobber || { echo "警告: 备份上传失败"; exit 0; }
            echo "已保留历史版 screener_${BK_DATE}.db"
          ); then
            : # 备份段成功（或已告警降级），继续
          fi
          # 2) 覆盖上传今日新 DB（永远执行——备份失败不阻断）
          gh release upload screener-seed --repo ${{ github.repository }} "$DB" --clobber
          # 3) 清理 7 天前的历史备份（只删 screener_YYYYMMDD.db 命名的）。
          #    delete-asset 失败时继续处理下一个，避免部分剪枝后残留累积；
          #    整体不因清理失败使 job 红（回滚数据宁多勿少）。
          cutoff=$(date -u -d '7 days ago' +%Y%m%d)
          gh release view screener-seed --repo ${{ github.repository }} --json assets \
            --jq '.assets[].name' 2>/dev/null | grep -E '^screener_[0-9]{8}\.db$' | while read -r a; do
            d="${a#screener_}"; d="${d%.db}"
            if [ "$d" -lt "$cutoff" ]; then
              gh release delete-asset screener-seed "$a" --repo ${{ github.repository }} --yes \
                && echo "清理过期备份 ${a}" || echo "警告: 清理 ${a} 失败（保留）"
            fi
          done || true
        env:
          GH_TOKEN: ${{ github.token }}

      # 失败建 Issue 通知（含 export 失败——continue-on-error 步失败不会让 job 红，需显式监听）
      - name: Create issue on failure
        if: steps.run_screener.outcome != 'success' || steps.export_json.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ 选股器每日更新失败',
              body: `## 选股器每日更新失败\n\n- **运行**: [查看日志](${context.serverUrl}/${context.repo.full_name}/actions/runs/${context.runId})\n- **时间**: ${new Date().toISOString()}\n\n请检查日志并手动触发 workflow_dispatch 重跑`,
              labels: ['bug', 'automation'],
            })
