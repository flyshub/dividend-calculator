name: Artifact Probe

# 一次性验证 workflow：确认 upload-artifact@v6 / download-artifact@v7 在 Node 24 下行为不变。
# 验证通过后应删除本文件（不是常驻工作流）。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Write probe file
        run: |
          mkdir -p probe-out
          printf 'artifact-probe-ok\n' > probe-out/marker.txt
      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: probe-marker
          path: probe-out/marker.txt
          retention-days: 1
      - name: Download
        uses: actions/download-artifact@v7
        with:
          name: probe-marker
          path: probe-in
      - name: Assert round-trip
        run: |
          test -f probe-in/marker.txt
          grep -qx 'artifact-probe-ok' probe-in/marker.txt
          echo 'artifact round-trip OK'
